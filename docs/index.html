  border-bottom: 2px solid var(--line-2);
  box-shadow: 0 6px 0 -4px rgba(0, 0, 0, 0.6);
}
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 14px;
  border: 2px solid transparent;
  background: transparent;
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: color var(--dur), border-color var(--dur), background var(--dur);
}
.tab svg { width: 16px; height: 16px; }
.tab:hover { color: var(--ink); border-color: var(--line-2); }
.tab.is-active { background: var(--pink); border-color: var(--pink); color: var(--accent-ink); box-shadow: 3px 3px 0 0 #000; }
.tab.is-active:hover { color: var(--accent-ink); }

/* ------------------------------------------------------------ responsive */
@media (max-width: 1099px) {
  .hdr-vitals { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .vital { padding: 9px 10px 11px; }
  .vital-num { font-size: 2rem; }
  .v-load .vital-num { font-size: 1.6rem; }
}
@media (max-width: 860px) {
  .hdr-main { grid-template-columns: minmax(0, 1fr); }
  .term-keys { display: none; }
}
@media (max-width: 720px) {
  .hdr { gap: 14px; padding-top: 14px; }
  .hdr-top { grid-template-areas: 'logo status' 'sub sub'; align-items: center; }
  .hdr-mode { display: none; }
  .hdr-sub { font-size: 10px; letter-spacing: 0.08em; margin-top: 8px; }
  .hdr-sync { height: 30px; padding: 0 8px; gap: 7px; letter-spacing: 0.08em; }
  .hdr-connect { height: 30px; padding: 0 8px; }
  .term-line { padding: 12px 10px 8px 12px; gap: 8px; }
  .term-prompt { font-size: 1.35rem; }
  .term-input, .term-cursor { font-size: 1.05rem; }
  .term-input { min-height: 40px; }
  .term-go { min-height: 44px; padding: 0 12px; }
  .term-go span { display: none; }
  .term-preview { padding: 0 10px 10px 12px; }
  .qa-tok:nth-of-type(n + 6) { display: none; }
  .clk-start { padding: 12px 14px 18px; }
  .clk-start-icon { width: 46px; height: 46px; }
  .clk-start-big { font-size: 1.9rem; }
  .clk-time { font-size: 2.3rem; }
  .clk-btns .btn { min-height: 42px; }
  .hdr-vitals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .v-today { grid-column: span 2; }
  .vital-num { font-size: 1.85rem; }
  .v-load .vital-num { font-size: 1.45rem; }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 70;
    margin: 0;
    padding: 0 0 env(safe-area-inset-bottom, 0px);
    background: var(--void);
    border-bottom: 0;
    border-top: 2px solid var(--pink);
    box-shadow: 0 -6px 0 0 rgba(0, 0, 0, 0.7);
  }
  .tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; overflow: visible; }
  .tab {
    flex-direction: column; justify-content: center; gap: 4px;
    height: 58px; padding: 0 2px;
    border: 0; border-top: 3px solid transparent;
    font-size: 9.5px; letter-spacing: 0.04em;
    overflow: hidden;
  }
  .tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tab svg { width: 21px; height: 21px; }
  .tab:hover { border-color: transparent; }
  .tab.is-active { background: rgba(255, 45, 149, 0.12); color: var(--pink); border-top-color: var(--pink); box-shadow: none; }
  .tab.is-active:hover { color: var(--pink); }
}
@media (max-width: 380px) {
  .hdr-logo { font-size: 1.9rem; }
  .hdr-connect span, .hdr-connect { font-size: 9px; }
}

/* overview.css */
/* Overview grid: 12 columns ≥1100px, 2 columns 720–1100px, 1 column on phones. */
.ov { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
.ov-cell { display: flex; flex-direction: column; min-width: 0; }
.ov-cell > * { flex: 1 1 auto; }
.ov-today { align-self: stretch; }
.ov-brief > *, .ov-chores > * { flex: 0 0 auto; }

@media (min-width: 720px) and (max-width: 1099.98px) {
  .ov { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ov-today { grid-column: 1; grid-row: 1 / span 2; }
  .ov-brief { grid-column: 2; grid-row: 1; }
  .ov-chores { grid-column: 2; grid-row: 2; }
  .ov-cal, .ov-wins { grid-column: 1 / -1; }
}
@media (min-width: 1100px) {
  .ov { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .ov-today { grid-column: 1 / 8; grid-row: 1 / span 2; }
  .ov-brief { grid-column: 8 / 13; grid-row: 1; }
  .ov-chores { grid-column: 8 / 13; grid-row: 2; }
  .ov-cal { grid-column: 1 / 13; }
  .ov-dead { grid-column: 1 / 7; }
  .ov-proj { grid-column: 7 / 13; }
  .ov-wins { grid-column: 1 / 13; }
  .ov-dead, .ov-proj { align-self: stretch; }
}

/* crashed panel */
.ov-crash { border-color: var(--blood); box-shadow: 4px 4px 0 var(--blood); }
.ov-crash .label { color: var(--blood); }
.ov-crash-msg { margin-top: 6px; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-2); overflow-wrap: anywhere; }

/* skeletons before the first state arrives */
.skel { min-height: 210px; overflow: hidden; }
.skel.is-tall { min-height: 360px; }
.skel .panel-head h2 { color: var(--ink-4); }
.skel-label { font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: 0.24em; color: var(--cyan); margin-bottom: 4px; }
.skel-dots { animation: led-blink 0.9s steps(2, start) infinite; }
.skel-bar { position: relative; height: 12px; margin-top: 14px; background: var(--panel-3); overflow: hidden; }
.skel-bar.is-short { width: 58%; }
.skel-bar::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(24, 228, 255, 0.28), transparent);
  transform: translateX(-100%);
  animation: skel-shimmer 1.3s linear infinite;
}
.skel::after {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: var(--cyan); box-shadow: 0 0 12px var(--cyan); opacity: 0.55;
  animation: skel-sweep 2.2s linear infinite;
}
@keyframes skel-shimmer { to { transform: translateX(100%); } }
@keyframes skel-sweep { from { top: 0; } to { top: 100%; } }

/* projects.css */
/* Projects: stencil names, shout percentages, segmented progress, milestone checklists. */
.proj-view { display: grid; gap: 22px; }
.proj { container-type: inline-size; container-name: proj; }
.proj .panel-body { display: grid; gap: 16px; }
.proj-head-t { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0; }
.proj-sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--ink-3); letter-spacing: 0.04em; }
.proj-head-n { display: inline-flex; align-items: baseline; gap: 6px; }
.proj-head-n b { font-size: 1.8rem; color: var(--acid); }
.proj-head-n b.is-dim { color: var(--ink-3); margin-left: 8px; }

.proj-grid { display: grid; gap: 14px; }

.proj-card {
  --c: var(--ink-3);
  position: relative;
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px 14px 14px;
  background: var(--panel-2);
  border: 2px solid var(--line-2);
  border-top: 5px solid var(--c);
  box-shadow: 4px 4px 0 #000;
  min-width: 0;
}
.proj-card::after {
  /* corner registration mark, zine style */
  content: ''; position: absolute; right: 8px; top: 8px; width: 10px; height: 10px; pointer-events: none;
  border-top: 2px solid var(--line-2); border-right: 2px solid var(--line-2);
}
.proj-card.is-paused { opacity: 0.7; border-top-style: dashed; filter: saturate(0.6); }
.proj-card.is-compact { gap: 10px; padding: 12px; box-shadow: 3px 3px 0 #000; }

.proj-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; min-width: 0; padding-right: 14px; }
.proj-id { display: flex; align-items: flex-start; gap: 10px; min-width: 0; flex: 1 1 auto; }
.proj-id .catmark { margin-top: 2px; }
.proj-id-t { display: grid; gap: 4px; min-width: 0; }
.proj-kind { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.12em; color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-name { font-size: 1.55rem; line-height: 0.95; overflow-wrap: break-word; hyphens: auto; }
.proj-card.is-compact .proj-name { font-size: 1.25rem; }

.proj-due { display: grid; justify-items: end; gap: 2px; flex: none; text-align: right; }
.proj-due b { font-size: 1.9rem; line-height: 0.85; color: var(--ink-2); }
.proj-due .label { white-space: nowrap; }
.proj-due.is-hot b { color: var(--pink); text-shadow: 0 0 14px rgba(255, 45, 149, 0.5); }
.proj-due.is-warn b { color: var(--hazard); }
.proj-due.is-late b { color: var(--blood); }
.proj-card.is-compact .proj-due b { font-size: 1.5rem; }

.proj-goal { color: var(--ink-2); font-size: var(--fs-sm); line-height: 1.4; }

.proj-progress { display: flex; align-items: center; gap: 14px; min-width: 0; }
.proj-pct { font-size: 3.1rem; color: var(--acid); line-height: 0.8; flex: none; text-shadow: 3px 3px 0 #000; min-width: 2ch; }
.proj-pct small { font-size: 0.45em; margin-left: 1px; color: var(--ink-2); vertical-align: top; }
.proj-card.is-compact .proj-pct { font-size: 2.3rem; }
.proj-progress-r { flex: 1 1 auto; min-width: 0; display: grid; gap: 6px; }
.proj-bar { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 2px; height: 12px; }
.proj-bar i { display: block; background: #26262e; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.6); }
.proj-bar i.on { background: var(--acid); box-shadow: 0 0 5px rgba(200, 255, 26, 0.45); }
.proj-bar i.on:last-of-type { background: var(--acid); }
.proj-counts { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; }

.proj-next { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; padding: 7px 9px; background: var(--void); border: 1px solid var(--line-2); border-left: 3px solid var(--pink); }
.proj-next-k { font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; color: var(--pink); flex: none; }
.proj-next-t { flex: 1 1 140px; min-width: 0; font-size: var(--fs-sm); font-weight: 600; }
.proj-next.is-clear { border-left-color: var(--acid); }
.proj-next.is-clear .proj-next-k { color: var(--acid); }
.proj-next.is-none { border-left-color: var(--line-2); }
.proj-next.is-none .proj-next-k { color: var(--ink-3); }

/* milestones: a vertical checklist with a spine */
.proj-ms-wrap { display: grid; gap: 8px; }
.proj-ms-list { list-style: none; margin: 0; padding: 0 0 0 4px; display: grid; gap: 2px; position: relative; }
.proj-ms-list::before { content: ''; position: absolute; left: 14px; top: 10px; bottom: 10px; width: 2px; background: var(--line-2); }
.proj-ms { position: relative; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 3px 6px 3px 0; min-width: 0; }
.proj-ms .check { position: relative; z-index: 1; }
.proj-ms-t { flex: 1 1 auto; min-width: 0; font-size: var(--fs-sm); cursor: pointer; overflow-wrap: anywhere; }
.proj-ms.is-done .proj-ms-t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--acid); text-decoration-thickness: 2px; }
.proj-ms.is-next { background: linear-gradient(90deg, rgba(255, 45, 149, 0.14), transparent 80%); }
.proj-ms.is-next .proj-ms-t { font-weight: 700; color: var(--ink); }
.proj-ms-next { font-family: var(--font-mono); font-size: 0.58rem; font-weight: 700; letter-spacing: 0.12em; color: #12000a; background: var(--pink); padding: 1px 5px; flex: none; }
.proj-ms-due { font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-3); white-space: nowrap; flex: none; }
.proj-ms-due.is-hot { color: var(--pink); }
.proj-ms-due.is-warn { color: var(--hazard); }
.proj-ms-due.is-late { color: var(--blood); font-weight: 700; }
.proj-ms-none { font-size: var(--fs-sm); }
.proj-ms-add { display: flex; align-items: center; gap: 8px; }
.proj-ms-add .field { flex: 1 1 auto; min-width: 0; min-height: 32px; padding-block: 4px; font-size: var(--fs-xs); background: transparent; border-style: dashed; }
.proj-ms-add .field:focus { border-style: solid; }
.proj-ms-plus { font-family: var(--font-mono); font-weight: 700; color: var(--pink); width: 22px; text-align: center; }

.proj-tasks { display: grid; gap: 6px; padding-top: 10px; border-top: 2px dashed var(--line); }
.proj-sub-h { margin: 0; }
.proj-task-list { display: grid; gap: 4px; min-width: 0; }
.proj-card-foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; padding-top: 4px; margin-top: auto; }

.proj-add {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 12px; border: 2px dashed var(--line-2);
}
.proj-add-k { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.1em; color: var(--pink); }
.proj-add > input.field { flex: 3 1 220px; min-width: 0; }
.proj-add > select.field { flex: 1 1 160px; min-width: 0; }

.proj-done-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.proj-done { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); }
.proj-done-name { flex: 1 1 160px; font-weight: 600; text-decoration: line-through; text-decoration-color: var(--acid); text-decoration-thickness: 2px; }
.proj-done-stamp { font-family: var(--font-display); font-weight: 900; font-size: 0.85rem; letter-spacing: 0.1em; color: var(--acid); border: 2px solid var(--acid); padding: 0 6px; transform: rotate(-4deg); }

@container proj (min-width: 680px) {
  .proj-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container proj (min-width: 1150px) {
  .proj-grid:not(.is-compact) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@container proj (min-width: 520px) {
  .proj-grid.is-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* setup.css */
/* Setup: GitHub wiring (status LED, numbered steps, token terminal), categories, capacity EQ, chores. */
.setup { display: grid; gap: 22px; }
.setup-hero { display: grid; gap: 6px; padding: 6px 2px 0; }
.setup-title { font-size: clamp(2.6rem, 8vw, 4.4rem); line-height: 0.85; letter-spacing: 0.04em; }
.setup-lede { color: var(--ink-2); max-width: 62ch; font-size: var(--fs-sm); }

.setup-grid { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.setup-col { display: grid; gap: 22px; min-width: 0; }
@media (min-width: 1100px) {
  .setup-grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
  #setup-cats, #setup-chores { grid-column: 1 / -1; }
}

.setup-sec { container-type: inline-size; container-name: setup; }
.setup-sec .panel-body { display: grid; gap: 16px; }
.setup-sec .panel-head { align-items: flex-start; }
.setup-sec-title { display: grid; gap: 6px; min-width: 0; }
.setup-sub { color: var(--ink-3); font-size: var(--fs-xs); line-height: 1.45; max-width: 70ch; }
.setup-mini-h { font-size: var(--fs-lg); }
.setup-ro { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px dashed var(--hazard); color: var(--hazard); font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.06em; text-transform: uppercase; }
.setup-ro svg { width: 14px; height: 14px; }
.setup-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.setup-link { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: var(--fs-xs); }
.setup-link svg { width: 15px; height: 15px; }
.setup-x { border: 0; background: transparent; color: inherit; padding: 0 0 0 4px; font-size: 0.8rem; line-height: 1; min-width: 20px; min-height: 20px; }
.setup-x:hover { color: var(--blood); }

/* badge in the GitHub head */
.setup-badge { display: inline-flex; align-items: center; gap: 6px; flex: none; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; letter-spacing: 0.1em; padding: 4px 8px; border: 2px solid var(--blood); color: var(--blood); }
.setup-badge.is-on { border-color: var(--acid); color: var(--acid); }
.setup-badge svg { width: 13px; height: 13px; }

/* live status */
.setup-status {
  --tone: var(--ink-3);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px; background: var(--void); border: 2px solid var(--tone); box-shadow: 4px 4px 0 #000;
}
.setup-status.is-good { --tone: var(--acid); }
.setup-status.is-busy { --tone: var(--cyan); }
.setup-status.is-warn { --tone: var(--hazard); }
.setup-status.is-bad { --tone: var(--blood); }
.setup-status.is-idle { --tone: var(--ink-3); }
.setup-led { width: 16px; height: 16px; background: var(--tone); box-shadow: 0 0 0 2px #000, 0 0 14px var(--tone); align-self: start; margin-top: 4px; }
.setup-status.is-busy .setup-led { animation: setup-blink 0.9s steps(2, start) infinite; }
@keyframes setup-blink { 50% { opacity: 0.25; } }
.setup-status-main { display: grid; gap: 3px; min-width: 0; }
.setup-status-kind { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-family: var(--font-shout); font-weight: 900; font-size: 1.5rem; line-height: 1; color: var(--tone); }
.setup-status-mode { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; letter-spacing: 0.1em; color: var(--ink-3); }
.setup-status-msg { font-size: var(--fs-sm); color: var(--ink-2); overflow-wrap: anywhere; }
.setup-status-at { font-family: var(--font-mono); font-size: 0.62rem; color: var(--ink-3); }

/* numbered steps */
.setup-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: none; }
.setup-step { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: start; }
.setup-step-n {
  font-family: var(--font-shout); font-weight: 900; font-size: 2rem; line-height: 0.85;
  color: transparent; -webkit-text-stroke: 1.3px var(--pink);
}
.setup-step:first-child .setup-step-n { color: var(--pink); -webkit-text-stroke: 0; }
.setup-step p { font-size: var(--fs-sm); line-height: 1.5; color: var(--ink-2); overflow-wrap: anywhere; }
.setup-step-t { color: var(--ink); font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 4px; }
.setup-step b:not(.setup-step-t) { color: var(--ink); background: rgba(255, 45, 149, 0.16); padding: 0 3px; }
.setup-step code, .setup-sec code { font-family: var(--font-mono); font-size: 0.86em; color: var(--cyan); background: var(--void); border: 1px solid var(--line-2); padding: 0 4px; }
.setup-step a { display: inline; font-family: var(--font-mono); font-size: 0.86em; overflow-wrap: anywhere; }
.setup-step a svg { width: 12px; height: 12px; margin-left: 4px; vertical-align: -1px; }

/* token terminal */
.setup-token { display: grid; gap: 8px; padding: 12px; border: 2px solid var(--pink); background: rgba(255, 45, 149, 0.05); }
.setup-inline { display: flex; align-items: stretch; gap: 8px; min-width: 0; flex-wrap: wrap; }
.setup-prompt { display: grid; place-items: center; width: 22px; font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-lg); color: var(--pink); }
.setup-token-input { flex: 1 1 220px; min-width: 0; min-height: 42px; letter-spacing: 0.04em; }
.setup-inline .btn { min-height: 42px; }
.setup-inline .btn:not(.btn-hot) { width: 42px; padding: 0; }
.setup-note { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; font-size: var(--fs-xs); color: var(--ink-3); }
.setup-ok { color: var(--acid); font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.08em; }
.setup-forget { color: var(--blood); border-color: var(--blood); }
.setup-forget:hover { background: var(--blood); color: #000; border-color: var(--blood); }

/* repo config (advanced) */
.setup-adv { border: 1px dashed var(--line-2); padding: 8px 12px; }
.setup-adv[open] { padding-bottom: 12px; }
.setup-adv summary { cursor: pointer; list-style: none; min-height: 32px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.setup-target { overflow-wrap: anywhere; }
.setup-edit { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--pink); }
.setup-adv[open] .setup-edit { visibility: hidden; }
.setup-adv summary::-webkit-details-marker { display: none; }
.setup-adv summary::before { content: '▸'; color: var(--pink); margin-right: 8px; font-family: var(--font-mono); }
.setup-adv[open] summary::before { content: '▾'; }
.setup-config { display: grid; gap: 12px; margin-top: 10px; }
.setup-cfg-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* categories */
.setup-cat-head, .setup-cat {
  display: grid;
  grid-template-columns: 24px 36px minmax(0, 1fr) auto;
  grid-template-areas: 'mark color name arch' 'glyph glyph group group' 'alias alias alias alias';
  gap: 6px 8px; align-items: center;
}
.setup-cat-head { display: none; }
.setup-cat { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.setup-cat > .catmark { grid-area: mark; }
.setup-cat-color { grid-area: color; display: block; width: 36px; height: 30px; }
.setup-cat-color input { width: 36px; height: 30px; padding: 0; border: 2px solid var(--line-2); background: var(--void); cursor: pointer; }
.setup-cat-color input::-webkit-color-swatch-wrapper { padding: 2px; }
.setup-cat-color input::-webkit-color-swatch { border: 0; }
.setup-cat-name { grid-area: name; min-height: 32px; padding-block: 4px; font-family: var(--font-body); font-weight: 600; }
.setup-cat-group { grid-area: group; min-height: 32px; padding-block: 2px; }
.setup-cat-glyph { grid-area: glyph; min-height: 32px; padding-block: 4px; text-transform: uppercase; text-align: center; }
.setup-cat-alias { grid-area: alias; min-height: 32px; padding-block: 4px; font-size: var(--fs-xs); color: var(--ink-2); }
.setup-cat-arch { grid-area: arch; }
.setup-cat-arch[aria-pressed='true'] { color: var(--hazard); border-color: var(--hazard); }
.setup-cat.is-archived { opacity: 0.55; }
.setup-cat.is-archived .setup-cat-name { text-decoration: line-through; }
.setup-cat-group { min-width: 0; }
.setup-catgrp { display: grid; gap: 0; margin-bottom: 10px; min-width: 0; }
.setup-group-h { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; }
.setup-group-h .tape { font-size: var(--fs-2xs); }
.setup-addrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 12px; border-top: 2px dashed var(--line); }
.setup-addrow > input.field { flex: 2 1 180px; min-width: 0; }
.setup-addrow > select.field { flex: 1 1 140px; min-width: 0; }

/* capacity: a 7-band graphic EQ */
.setup-eq { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.setup-eq-col { display: grid; gap: 5px; justify-items: center; min-width: 0; padding: 8px 4px 6px; border: 1px solid transparent; }
.setup-eq-col.is-today { border-color: var(--pink); background: rgba(255, 45, 149, 0.06); }
.setup-eq-bar { display: grid; grid-template-rows: repeat(12, minmax(0, 1fr)); gap: 2px; width: min(30px, 100%); height: 110px; }
.setup-eq-bar i { display: block; background: #222229; }
.setup-eq-bar i.on { background: var(--cyan); box-shadow: 0 0 5px rgba(24, 228, 255, 0.5); }
.setup-eq-bar i.on:nth-child(-n + 4) { background: var(--pink); box-shadow: 0 0 5px rgba(255, 45, 149, 0.5); }
.setup-eq-bar i.on:nth-child(n + 5):nth-child(-n + 6) { background: var(--hazard); box-shadow: 0 0 5px rgba(255, 214, 10, 0.5); }
.setup-eq-h { font-family: var(--font-shout); font-weight: 900; font-size: 1.05rem; line-height: 1; color: var(--ink); white-space: nowrap; }
.setup-eq-d { font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.setup-eq-col.is-today .setup-eq-d { color: var(--pink); }
.setup-eq-in { width: 100%; min-height: 34px; padding: 4px 2px; text-align: center; font-size: var(--fs-xs); -moz-appearance: textfield; }
.setup-eq-in::-webkit-inner-spin-button, .setup-eq-in::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.setup-eq-total { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.setup-eq-total b { font-size: 2rem; color: var(--cyan); }
.setup-eq-total .faint { font-family: var(--font-mono); font-size: var(--fs-2xs); }

.setup-off { display: grid; gap: 8px; padding-top: 12px; border-top: 2px dashed var(--line); }
.setup-off-list { display: flex; flex-wrap: wrap; gap: 6px; }
.setup-off-list .chip { height: 28px; }
.setup-none { font-family: var(--font-mono); font-size: var(--fs-2xs); }
.setup-off-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.setup-off-add .field { width: auto; flex: 0 1 190px; color-scheme: dark; }

/* chores */
.setup-chores { display: grid; gap: 0; }
.setup-chore {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 10px;
  padding: 10px 0; border-bottom: 1px dashed var(--line);
}
.setup-chore > .catmark { align-self: center; }
.setup-chore-title { flex: 1 1 160px; width: auto; min-height: 34px; padding-block: 4px; font-family: var(--font-body); font-weight: 600; }
.setup-chore-cad { align-self: center; }
.setup-chore-num { display: grid; gap: 3px; min-width: 0; flex: 1 1 64px; }
.setup-chore-num .field { min-height: 32px; padding: 2px 6px; width: 100%; text-align: center; }
.setup-chore-gap { flex: 1 1 64px; }
.setup-chore-acts { display: flex; gap: 8px; justify-content: flex-end; margin-left: auto; }
.setup-chore.is-off { opacity: 0.55; }
.setup-del.is-armed { background: var(--blood); border-color: var(--blood); color: #000; }

/* about */
.setup-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.setup-stat { display: grid; gap: 2px; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line-2); min-width: 0; }
.setup-stat b { font-size: 1.8rem; color: var(--ink); }
.setup-stat:first-child b { color: var(--pink); }
.setup-about-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.setup-about-list li { display: flex; justify-content: space-between; gap: 10px; font-size: var(--fs-sm); border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.setup-about-list li span:last-child { color: var(--ink-2); font-family: var(--font-mono); font-size: var(--fs-xs); text-align: right; overflow-wrap: anywhere; }
.setup-sec a.btn { text-decoration: none; }

@container setup (max-width: 520px) {
  .setup-prompt { display: none; }
  .setup-token-input { flex-basis: 100%; }
  .setup-inline .btn-hot { flex: 1 1 auto; }
  .setup-status { grid-template-columns: auto minmax(0, 1fr); }
  .setup-status > .btn { grid-column: 1 / -1; justify-self: start; }
}
@container setup (min-width: 560px) {
  .setup-cfg-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .setup-chore { display: grid; grid-template-columns: 24px minmax(0, 1fr) 92px 76px 76px 76px 132px; }
  .setup-chore-cad { justify-self: start; }
  .setup-chore-acts { margin-left: 0; }
  .setup-chore-num .label { font-size: 0.56rem; }
}
@container setup (min-width: 860px) {
  .setup-cat-head, .setup-cat {
    grid-template-columns: 24px 36px minmax(140px, 1fr) 150px 64px minmax(160px, 1.3fr) 104px;
    grid-template-areas: 'mark color name group glyph alias arch';
  }
  .setup-cat-head { display: grid; padding-bottom: 4px; }
  .setup-cat > * { grid-area: auto; }
  .setup-cat > .catmark { grid-area: auto; }
}
@media (pointer: coarse) {
  .setup-cat-name, .setup-cat-group, .setup-cat-glyph, .setup-cat-alias, .setup-chore-title, .setup-chore-num .field { min-height: 40px; }
}

/* taskrow.css */
/* taskRow: [check] [catmark] [title / meta chips] [actions]
   Base layout (touch + anything unknown): title gets the full width, the
   actions sit at the end of the meta line. Fine pointers float them on hover. */
.trow {
  --c: var(--ink-3);
  position: relative;
  display: grid;
  grid-template-columns: 28px 24px minmax(0, 1fr) auto;
  grid-template-areas: 'check cat title title' 'check cat meta acts';
  column-gap: 10px;
  row-gap: 4px;
  align-items: center;
  padding: 8px 8px 8px 6px;
  border-bottom: 1px dashed var(--line);
  transition: background var(--dur);
}
.trow:last-child { border-bottom: 0; }
.trow.no-meta { grid-template-areas: 'check cat title acts'; }
.trow::before {
  content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px;
  background: var(--c); opacity: 0; transition: opacity var(--dur);
}
.trow:hover { background: var(--panel-2); }
.trow:hover::before, .trow:focus-within::before { opacity: 1; }

.trow-check { grid-area: check; display: grid; place-items: center; width: 28px; height: 28px; cursor: pointer; }
.trow > .catmark { grid-area: cat; }

.trow-title {
  grid-area: title;
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  font-weight: 500;
  line-height: 1.3;
  text-align: left;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.trow-title:focus-visible { box-shadow: none; outline: 2px solid var(--cyan); outline-offset: 2px; }
.trow-title:hover .trow-text { text-decoration: underline dotted var(--cyan); text-underline-offset: 4px; }
.trow-text {
  background: linear-gradient(var(--acid), var(--acid)) 0 60% / 0% 2px no-repeat;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  transition: background-size 300ms var(--ease), color 200ms;
}
.trow-prio { margin-right: 6px; font-family: var(--font-mono); font-size: 0.8em; font-weight: 700; letter-spacing: -0.06em; color: var(--pink); }
.trow-prio.is-crit { color: var(--blood); text-shadow: 0 0 10px rgba(255, 59, 48, 0.5); }

.trow-meta { grid-area: meta; display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.trow-meta .chip { height: 19px; padding: 0 5px; gap: 4px; font-size: 10px; }
.trow-meta .chip svg { width: 10px; height: 10px; }
.chip-proj { max-width: 100%; }
.chip-trunc { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; }

.trow-acts { grid-area: acts; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.trow-btn { min-width: 28px; }
.trow-btn.is-clock { color: var(--pink); }
.trow-btn.is-clock:hover { border-color: var(--pink); color: var(--pink); }
.trow-btn.is-clock svg { fill: currentColor; }
.trow-btn.is-yes { color: var(--acid); border-color: var(--acid); }
.trow-btn.is-yes:hover { background: var(--acid); color: #000; }
.trow-btn.is-drop:hover { color: var(--blood); border-color: var(--blood); }
.trow-btn.is-tmrw { color: var(--hazard); border-color: var(--hazard); }
.trow-btn.is-tmrw:hover { background: var(--hazard); color: #000; }
.trow-acts.has-tmrw .is-edit { display: none; }

/* triage rows: Yes / Today / Drop on their own line */
.trow.is-triage { grid-template-columns: 28px 24px minmax(0, 1fr); grid-template-areas: 'check cat title' 'check cat meta' 'acts acts acts'; }
.trow.is-triage.no-meta { grid-template-areas: 'check cat title' 'acts acts acts'; }
.trow.is-triage .trow-acts { padding-top: 4px; }
.trow.is-triage .trow-btn { flex: 1; max-width: 116px; }
.trow.is-triage.is-overdue::before { opacity: 0; }

/* touch: 40px targets */
@media (hover: none), (pointer: coarse) {
  .trow { grid-template-columns: 40px 24px minmax(0, 1fr) auto; column-gap: 8px; padding: 8px 2px 8px 0; }
  .trow.is-triage { grid-template-columns: 40px 24px minmax(0, 1fr); }
  .trow-check { width: 40px; height: 40px; }
  .trow-title { min-height: 26px; }
  .trow-btn { min-height: 40px; min-width: 40px; }
  .trow-btn.is-edit { display: none; }
  .trow-acts.has-tmrw .is-move { display: none; }
}

/* mouse: actions float in on hover / keyboard focus, title keeps the width */
@media (hover: hover) and (pointer: fine) {
  .trow:not(.is-triage) { grid-template-columns: 28px 24px minmax(0, 1fr); grid-template-areas: 'check cat title' 'check cat meta'; }
  .trow.no-meta:not(.is-triage) { grid-template-areas: 'check cat title'; }
  .trow-acts:not(.is-pinned) {
    position: absolute; right: 6px; top: 50%; z-index: 2;
    padding: 3px;
    background: var(--panel-3);
    border: 1px solid var(--line-2);
    box-shadow: 3px 3px 0 #000;
    opacity: 0;
    pointer-events: none;
    transform: translate(6px, -50%);
    transition: opacity 110ms, transform 110ms var(--ease);
  }
  .trow:hover .trow-acts, .trow:focus-within .trow-acts { opacity: 1; pointer-events: auto; transform: translate(0, -50%); }
  .trow[draggable='true'] { cursor: grab; }
  .trow[draggable='true']:active { cursor: grabbing; }
}
@media (min-width: 1100px) and (hover: hover) and (pointer: fine) {
  .trow.is-triage { grid-template-columns: 28px 24px minmax(0, 1fr) auto; grid-template-areas: 'check cat title acts' 'check cat meta acts'; }
  .trow.is-triage.no-meta { grid-template-areas: 'check cat title acts'; }
  .trow.is-triage .trow-acts { padding-top: 0; }
  .trow.is-triage .trow-btn { flex: none; }
}

/* states */
.trow.is-overdue::before { opacity: 1; width: 3px; background: var(--blood); }
.trow.is-low .trow-text { color: var(--ink-2); }
.trow.is-done .trow-text, .trow.is-completing .trow-text { color: var(--ink-3); background-size: 100% 2px; }
.trow.is-done .catmark { filter: grayscale(0.85) brightness(0.7); }
.trow.is-dropped .trow-text { color: var(--ink-4); text-decoration: line-through; }
.trow.is-completing { background: rgba(200, 255, 26, 0.08); animation: row-thunk 240ms 70ms var(--ease); }
.trow.is-completing::before { opacity: 1; background: var(--acid); width: 3px; }
.trow.is-completing .check { border-color: var(--acid); box-shadow: var(--glow-acid); }
.trow.is-completing .check::before { animation: slash-a 170ms var(--ease) both; }
.trow.is-completing .check::after { animation: slash-b 170ms 90ms var(--ease) both; }
.trow.is-completing .trow-acts { opacity: 0 !important; pointer-events: none !important; }
.trow.is-dragging { opacity: 0.4; outline: 2px dashed var(--pink); outline-offset: -2px; }
@keyframes slash-a { from { transform: translate(-50%, -50%) rotate(45deg) scaleX(0); } to { transform: translate(-50%, -50%) rotate(45deg) scaleX(1); } }
@keyframes slash-b { from { transform: translate(-50%, -50%) rotate(-45deg) scaleX(0); } to { transform: translate(-50%, -50%) rotate(-45deg) scaleX(1); } }
@keyframes row-thunk { 0% { transform: translateY(0); } 40% { transform: translateY(2px); } 100% { transform: none; } }

/* compact rows (calendar / project lists) */
.trow.is-compact { padding: 5px 6px 5px 4px; column-gap: 8px; row-gap: 2px; }
.trow.is-compact .trow-title { font-size: var(--fs-sm); }
.trow.is-compact > .catmark { width: 18px; height: 18px; font-size: 7px; }

/* today.css */
/* Today panel: the hero list. */
.today { display: flex; flex-direction: column; }
.today-head { position: relative; flex-wrap: wrap; padding: 14px 16px 12px; gap: 10px 16px; transition: background var(--dur); }
.today-title { display: flex; align-items: center; gap: 14px; min-width: 0; }
.today .today-head h2 { font-size: clamp(1.9rem, 1.5rem + 1vw, 2.4rem); text-shadow: 3px 3px 0 #000; }
.today-tape { transform: rotate(-2.5deg) translateY(-2px); font-size: var(--fs-xs); }
.today-score { display: grid; grid-template-columns: auto auto; align-items: baseline; column-gap: 8px; row-gap: 4px; margin-left: auto; }
.today-num { font-size: 2.4rem; color: var(--ink); white-space: nowrap; }
.today-num b { font-weight: 900; color: var(--acid); text-shadow: 0 0 16px rgba(200, 255, 26, 0.35); }
.today-of { color: var(--ink-4); margin: 0 2px; }
.today-score .meter { grid-column: 1 / -1; width: 132px; }

/* drop target (drag a task here → today) */
.today-drop-hint { display: none; }
html.is-dragging-task .today-drop-hint {
  position: absolute; inset: 4px; z-index: 3;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 2px dashed var(--pink);
  background: rgba(11, 11, 13, 0.86);
  color: var(--pink);
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  pointer-events: none;
}
.today-head.is-drop { background: rgba(255, 45, 149, 0.1); outline: 2px dashed var(--pink); outline-offset: -4px; }
.today-head.is-drop .today-drop-hint { background: rgba(255, 45, 149, 0.2); color: var(--ink); }

.today-body { flex: 1; display: flex; flex-direction: column; padding-top: 8px; }

/* sections */
.tsec { margin-top: 16px; }
.tsec:first-child { margin-top: 2px; }
.tsec-hazard { margin: 0 -16px 10px; height: 8px; }
.tsec-head, .tsec-toggle {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 0 6px;
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.tsec-head svg, .tsec-toggle svg { width: 14px; height: 14px; }
.tsec-label { margin: 0; font-family: var(--font-mono); font-size: inherit; font-weight: 700; letter-spacing: inherit; line-height: 1.2; text-transform: uppercase; white-space: nowrap; color: inherit; }
.tsec-hint { color: var(--ink-4); letter-spacing: 0.04em; text-transform: none; white-space: nowrap; }
.tsec-rule { flex: 1; min-width: 12px; border-top: 1px dashed currentColor; opacity: 0.45; }
.tsec-count { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.tsec-list { border-left: 2px solid var(--line); padding-left: 2px; }

.tone-hazard > .tsec-head { color: var(--hazard); }
.tone-hazard > .tsec-list { border-left-color: var(--hazard); }
.tone-crit > .tsec-head { color: var(--blood); }
.tone-crit > .tsec-head .tsec-count { color: var(--blood); }
.tone-crit > .tsec-list { border-left-color: var(--blood); background: linear-gradient(90deg, rgba(255, 59, 48, 0.06), transparent 40%); }
.tone-hot > .tsec-head { color: var(--pink); }
.tone-hot > .tsec-list { border-left-color: var(--pink); }
.tone-cyan > .tsec-head { color: var(--cyan); }
.tone-cyan > .tsec-list { border-left-color: rgba(24, 228, 255, 0.5); }
.tone-ink > .tsec-head { color: var(--ink); }
.tone-faint > .tsec-head { color: var(--ink-3); }

.tsec-done { margin-top: 18px; border-top: 2px dashed var(--line); padding-top: 6px; }
.tsec-toggle { width: 100%; border: 0; background: none; color: var(--acid); cursor: pointer; padding: 8px 0; }
.tsec-toggle:hover .tsec-label { text-decoration: underline; text-underline-offset: 3px; }
.tsec-toggle .tsec-count { color: var(--acid); }
.tsec-done > .tsec-list { border-left-color: rgba(200, 255, 26, 0.45); }

/* empty: clear board */
.today-empty { flex: 1; display: grid; place-items: center; padding: 26px 8px 18px; }
.today-sticker { max-width: 380px; padding: 20px 22px 18px; text-align: center; transform: rotate(-1.6deg); display: grid; gap: 8px; }
.today-sticker .scrawl {
  justify-self: center;
  font-size: 2.3rem; line-height: 1; color: var(--paper-ink);
  background: linear-gradient(transparent 58%, var(--acid) 58% 90%, transparent 90%);
  padding: 0 6px;
}
.today-empty-sub { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.today-empty-hint { font-family: var(--font-mono); font-size: var(--fs-xs); color: #3a3a3a; }
.today-empty-hint code { background: #111; color: var(--acid); padding: 1px 6px; font-family: var(--font-mono); white-space: nowrap; }

/* footer readout */
.today-foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  padding: 9px 16px 11px;
  border-top: 2px dashed var(--line);
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.today-foot b { color: var(--ink); font-weight: 700; }
.today-foot .sep { color: var(--pink); }
.today-foot .is-hot, .today-foot .is-hot b { color: var(--pink); }

@media (max-width: 720px) {
  .today-head { padding: 12px 12px 10px; }
  .today-body { padding-inline: 12px; }
  .tsec-hazard { margin-inline: -12px; }
  .today-num { font-size: 2rem; }
  .today-score .meter { width: 96px; }
  .tsec-hint { display: none; }
  .today-foot { padding-inline: 12px; }
}

/* wins.css */
/* Wins: acid streak in shout type, a punchy 12-week heatmap, category bars, the record. */
.wins-view { display: grid; gap: 22px; }
.wins, .wins-hero, .wins-log { container-type: inline-size; }
.wins { container-name: winsc; }
.wins-hero { container-name: winsh; }
.wins-log { container-name: winsl; }

/* ---- streak ---- */
.wins-streak {
  position: relative; display: grid; align-content: start; gap: 2px 18px;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas: 'label label' 'num side';
  padding: 12px 14px 14px;
  background:
    radial-gradient(circle at 30% 60%, rgba(200, 255, 26, 0.16), transparent 62%),
    repeating-linear-gradient(-45deg, rgba(200, 255, 26, 0.05) 0 2px, transparent 2px 9px),
    var(--void);
  border: 2px solid var(--acid);
  box-shadow: var(--shadow-acid);
  min-width: 0;
}
.wins-streak.is-zero { border-color: var(--line-2); box-shadow: var(--shadow-ink); background: var(--void); }
.wins-streak > .label { grid-area: label; }
.wins-streak-n { grid-area: num; display: flex; align-items: flex-end; gap: 8px; line-height: 0.8; min-width: 0; }
.wins-streak-side { grid-area: side; align-self: end; display: grid; gap: 6px; justify-items: start; padding-bottom: 6px; min-width: 0; }
.wins-streak-to { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--acid); letter-spacing: 0.08em; text-transform: uppercase; }
.wins-streak.is-compact { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'label' 'num' 'side'; }
.wins-streak-n b {
  font-size: clamp(4.4rem, 12cqi, 7.6rem); color: var(--acid);
  text-shadow: -3px 0 rgba(255, 45, 149, 0.85), 3px 1px rgba(24, 228, 255, 0.7), 5px 5px 0 #000, 0 0 34px rgba(200, 255, 26, 0.35);
  animation: wins-jitter 5s steps(1) infinite;
}
@keyframes wins-jitter {
  0%, 94%, 100% { transform: none; }
  95% { transform: translate(-2px, 1px) skewX(-4deg); }
  97% { transform: translate(2px, -1px); }
}
.wins-streak.is-zero .wins-streak-n b { color: var(--ink-3); text-shadow: 3px 3px 0 #000; animation: none; }
.wins-streak.is-compact .wins-streak-n b { font-size: clamp(3.6rem, 9cqi, 5.4rem); }
.wins-streak-u { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; letter-spacing: 0.08em; color: var(--ink); padding-bottom: 6px; }
.wins-streak-best { font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.wins-record {
  display: inline-block; font-family: var(--font-display); font-weight: 900; font-size: 0.85rem; letter-spacing: 0.1em;
  color: #0b1200; background: var(--acid); padding: 1px 8px; transform: rotate(-3deg); box-shadow: 2px 2px 0 #000;
}
.wins-quip { color: var(--hazard); font-size: var(--fs-md); transform: rotate(-1.5deg); margin-top: 4px; }

/* ---- this week ---- */
.wins-week { display: grid; gap: 10px; align-content: start; min-width: 0; }
.wins-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.wins-stat { display: grid; gap: 4px; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid var(--ink-3); min-width: 0; }
.wins-stat b { font-size: 2.3rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wins-stat.is-acid { border-left-color: var(--acid); }
.wins-stat-foot { font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.wins-stat.is-acid b { color: var(--acid); }
.wins-stat.is-pink { border-left-color: var(--pink); }
.wins-stat.is-pink b { color: var(--pink); }

/* ---- heatmap ---- */
.wins-hm { display: grid; gap: 8px; min-width: 0; align-content: start; }
.wins-hm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.wins-hm-sum { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.wins-hm-sum b { color: var(--acid); font-weight: 700; }
.wins-hm-body {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto auto;
  gap: 4px 6px;
  max-width: 560px;
}
.wins-hm-months, .wins-hm-grid { display: grid; grid-template-columns: repeat(var(--weeks, 12), minmax(0, 1fr)); gap: 3px; min-width: 0; }
.wins-hm-m { font-family: var(--font-mono); font-size: 0.56rem; letter-spacing: 0.08em; color: var(--ink-3); white-space: nowrap; overflow: visible; height: 0.8rem; }
.wins-hm-wd { display: grid; grid-template-rows: repeat(7, minmax(0, 1fr)); gap: 3px; }
.wins-hm-wd span { font-family: var(--font-mono); font-size: 0.56rem; color: var(--ink-3); line-height: 1; display: flex; align-items: center; }
.wins-hm-col { display: grid; grid-template-rows: repeat(7, auto); gap: 3px; }
.wins-hm-cell {
  display: block; aspect-ratio: 1 / 1; min-width: 6px;
  background: #1b1b21;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
}
.wins-hm-cell.l1 { background: rgba(200, 255, 26, 0.24); }
.wins-hm-cell.l2 { background: rgba(200, 255, 26, 0.48); }
.wins-hm-cell.l3 { background: rgba(200, 255, 26, 0.74); }
.wins-hm-cell.l4 { background: var(--acid); box-shadow: 0 0 8px rgba(200, 255, 26, 0.55); }
.wins-hm-cell.is-today { outline: 2px solid var(--pink); outline-offset: 1px; position: relative; z-index: 1; }
.wins-hm-cell.is-void { visibility: hidden; }
.wins-hm-grid .wins-hm-cell:not(.is-void):hover { outline: 2px solid var(--cyan); outline-offset: 1px; }
.wins-hm-key { display: flex; align-items: center; gap: 4px; }
.wins-hm-key .wins-hm-cell { width: 11px; min-width: 11px; }
.wins-hm-key .label:first-child { margin-right: 4px; }
.wins-hm-key .label:last-child { margin-left: 4px; }

/* ---- per-category bars ---- */
.wins-cats { display: grid; gap: 10px; align-content: start; min-width: 0; }
.wins-sub-h { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-lg); }
.wins-sub-h .slash { color: var(--acid); }
.wins-cat-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.wins-cat { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) 2.2ch; align-items: center; gap: 10px; min-width: 0; }
.wins-cat-name { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wins-cat-bar { position: relative; height: 12px; background: #1b1b21; overflow: hidden; }
.wins-cat-bar i { display: block; height: 100%; background: var(--c, var(--acid)); box-shadow: 0 0 8px color-mix(in srgb, var(--c, #c8ff1a) 50%, transparent); }
.wins-cat-bar::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 7px, var(--panel) 7px 9px); pointer-events: none; }
.wins-cat-n { font-family: var(--font-shout); font-weight: 900; font-size: 1.25rem; text-align: right; color: var(--ink); }
.wins-none { font-size: var(--fs-sm); }

/* ---- rows ---- */
.wins-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.wins-row { display: flex; align-items: center; gap: 9px; min-height: 30px; padding: 3px 4px; min-width: 0; border-bottom: 1px dashed var(--line); }
.wins-row:last-child { border-bottom: 0; }
.wins-tick { flex: none; width: 1.2em; text-align: center; font-family: var(--font-mono); font-weight: 700; color: var(--acid); }
.wins-row.is-milestone .wins-tick { color: var(--pink); }
.wins-row.is-win .wins-tick { color: var(--hazard); }
.wins-row-t { flex: 1 1 auto; min-width: 0; display: grid; }
.wins-row-title { font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wins-row.is-win .wins-row-title, .wins-row.is-milestone .wins-row-title { font-weight: 700; }
.wins-row-proj { font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wins-stamp {
  flex: none; font-family: var(--font-display); font-weight: 900; font-size: 0.68rem; letter-spacing: 0.12em;
  color: var(--pink); border: 2px solid var(--pink); padding: 0 5px; line-height: 1.35; transform: rotate(-4deg);
}
.wins-stamp.is-win { color: var(--hazard); border-color: var(--hazard); transform: rotate(3deg); }
.wins-row-cat { flex: none; display: inline-flex; }
.wins-row-d { flex: none; font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-3); letter-spacing: 0.06em; white-space: nowrap; }

.wins-recent { display: grid; gap: 8px; align-content: start; min-width: 0; }

/* ---- the record ---- */
.wins-log .panel-body { display: grid; gap: 14px; }
.wins-days { display: grid; gap: 18px; }
.wins-day { display: grid; gap: 6px; break-inside: avoid; min-width: 0; }
.wins-day-h { display: flex; align-items: center; gap: 10px; margin: 0; }
.wins-day-h .tape { font-size: var(--fs-2xs); }
.wins-day:nth-child(3n + 1) .wins-day-h .tape { transform: rotate(1.2deg); }
.wins-day:nth-child(3n + 2) .wins-day-h .tape { transform: rotate(-0.6deg); }
.wins-more { justify-self: center; }

/* ---- layouts ---- */
.wins-hero-grid { display: grid; gap: 22px; min-width: 0; }
.wins-compact { display: grid; gap: 18px; min-width: 0; }

@container winsh (min-width: 640px) {
  .wins-hero-grid { grid-template-columns: minmax(200px, 0.8fr) minmax(0, 1.2fr); }
  .wins-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container winsh (min-width: 1000px) {
  .wins-hero-grid {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: 'streak week' 'heat cats';
    gap: 26px 30px;
  }
  .wins-hero-grid > .wins-streak { grid-area: streak; }
  .wins-hero-grid > .wins-week { grid-area: week; align-self: end; }
  .wins-hero-grid > .wins-hm { grid-area: heat; }
  .wins-hero-grid > .wins-cats { grid-area: cats; }
  .wins-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@container winsc (max-width: 719px) {
  .wins-streak.is-compact { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: 'label label' 'num side'; }
}
@container winsc (min-width: 720px) {
  .wins-compact { grid-template-columns: minmax(170px, 0.6fr) minmax(260px, 1.1fr) minmax(0, 1.3fr); align-items: start; }
}
@container winsl (min-width: 760px) {
  .wins-days { display: block; columns: 2 320px; column-gap: 32px; }
  .wins-day { margin-bottom: 18px; }
}
@container winsl (min-width: 1200px) {
  .wins-days { columns: 3 320px; }
}
